name: Deploy to Development

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean remote frontend directory
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          script: |
            cd project/frontend
            rm -rf dist
            mkdir -p dist

      - name: Upload frontend files
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          source: |
            ./docker-compose.yml
            ./Dockerfile.frontend
            ./README.md
            ./app/dist/*
          target: project/frontend

      - name: Restart Frontend Container
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          password: ${{ secrets.DEV_SSH_PASSWORD }}
          script: |
            cd project/frontend
            docker compose up -d --build