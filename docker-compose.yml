services:
      
  frontend:
    deploy:
      restart_policy:
        condition: always
    build:
      context: ./
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - db
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=http"
      - "traefik.http.routers.frontend.rule=Host(`testnet.holdslaves.com`)"
      - "traefik.http.middlewares.frontend-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.frontend.middlewares=frontend-https-redirect"
      - "traefik.http.routers.frontend-secure.entrypoints=https"
      - "traefik.http.routers.frontend-secure.rule=Host(`testnet.holdslaves.com`)"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.service=frontend"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"
    networks:
      - app_network
      - proxy

  backend:
    deploy:
      restart_policy:
        condition: always
    build:
      context: ./
      dockerfile: docker/Dockerfile.backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.entrypoints=http"
      - "traefik.http.routers.server.rule=Host(`api.testnet.holdslaves.com`)"
      - "traefik.http.middlewares.server-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.server.middlewares=frontend-https-redirect"
      - "traefik.http.routers.server-secure.entrypoints=https"
      - "traefik.http.routers.server-secure.rule=Host(`api.testnet.holdslaves.com`)"
      - "traefik.http.routers.server-secure.tls=true"
      - "traefik.http.routers.server-secure.service=server"
      - "traefik.http.services.server.loadbalancer.server.port=4000"
      - "traefik.docker.network=proxy"
    networks:
      - app_network
      - proxy
    ports:
      - "4000:4000"

  db:
    deploy:
      restart_policy:
        condition: always
    image: postgres:latest
    environment:
      POSTGRES_USER: 
      POSTGRES_PASSWORD: 
      POSTGRES_DB: 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6000:5432"
    networks:
      - app_network
    
networks:
  app_network:
    driver: bridge
  proxy:
    external: true

volumes:
  postgres_data:
    driver: local