events {}

http {
  include        mime.types;

  server {
    listen 80;
    server_name testnet.holdslaves.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|otf|svg|mp4|webm)$ {
        expires max;
        log_not_found off;
    }
  }
}